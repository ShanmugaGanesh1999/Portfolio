    <!-- Apply the saved theme before first paint (no flash of wrong theme) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("sg-theme");
          if (t !== "light" && t !== "dark") t = "dark";
        } catch (e) {
          t = "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
